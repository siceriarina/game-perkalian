<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Math Game Online</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
    font-family: Arial;
    background: #1e1e2f;
    color: white;
    text-align: center;
}

.container {
    max-width: 400px;
    margin: auto;
    padding: 20px;
}

.question {
    font-size: 40px;
    margin: 20px 0;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    padding: 15px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #00a8ff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #0097e6;
}

.correct { background: green !important; }
.wrong { background: red !important; }

#endScreen {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ Math Game</h1>

<div id="game">
    <p>Soal: <span id="count">1</span>/10</p>
    <p>🔥 Combo: <span id="combo">0</span></p>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
</div>

<div id="endScreen">
    <h2>Game Selesai 🎉</h2>
    <p>⏱ Waktu: <span id="finalTime"></span> detik</p>

    <input id="playerName" placeholder="Nama kamu">
    <br><br>
    <button onclick="saveScore()">Simpan Skor</button>

    <h3>🏆 Leaderboard</h3>
    <div id="leaderboard"></div>

    <br>
    <button onclick="startGame()">Main Lagi</button>
</div>

</div>

<script>
// ================== SUPABASE SETUP ==================
const supabaseUrl = "https://nomeqletxpgeerqwaljp.supabase.co";
const supabaseKey = "sb_publishable_2hE9utaePJLkFkbRUrm_ZA_u1m4NC3M"; 

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ================== GAME ==================
let num1, num2, correct;
let current = 0;
let combo = 0;
let startTime;

function startGame() {
    current = 0;
    combo = 0;

    document.getElementById("game").style.display = "block";
    document.getElementById("endScreen").style.display = "none";

    startTime = new Date();

    nextQuestion();
}

function nextQuestion() {
    current++;

    if (current > 10) {
        endGame();
        return;
    }

    document.getElementById("count").textContent = current;

    num1 = Math.floor(Math.random()*9)+1;
    num2 = Math.floor(Math.random()*9)+1;
    correct = num1 * num2;

    document.getElementById("question").textContent = `${num1} × ${num2}`;

    let answers = [correct];

    while (answers.length < 4) {
        let wrong = correct + Math.floor(Math.random()*10)-5;
        if (!answers.includes(wrong) && wrong > 0) {
            answers.push(wrong);
        }
    }

    answers.sort(() => Math.random() - 0.5);

    const box = document.getElementById("answers");
    box.innerHTML = "";

    answers.forEach(a => {
        let btn = document.createElement("button");
        btn.textContent = a;
        btn.onclick = () => checkAnswer(a, btn);
        box.appendChild(btn);
    });
}

function checkAnswer(ans, btn) {
    if (ans === correct) {
        combo++;
        btn.classList.add("correct");
    } else {
        combo = 0;
        btn.classList.add("wrong");
    }

    document.getElementById("combo").textContent = combo;

    setTimeout(nextQuestion, 400);
}

function endGame() {
    let time = ((new Date() - startTime)/1000).toFixed(2);

    document.getElementById("game").style.display = "none";
    document.getElementById("endScreen").style.display = "block";

    document.getElementById("finalTime").textContent = time;

    loadLeaderboard();
}

// ================== LEADERBOARD ==================
async function saveScore() {
    const name = document.getElementById("playerName").value || "Anonim";
    const time = parseFloat(document.getElementById("finalTime").textContent);

    await supabaseClient.from("scores").insert([
        { name, time }
    ]);

    loadLeaderboard();
}

async function loadLeaderboard() {
    const { data } = await supabaseClient
        .from("scores")
        .select("*")
        .order("time", { ascending: true })
        .limit(10);

    let html = "";

    data.forEach((d, i) => {
        html += `<p>${i+1}. ${d.name} - ${d.time}s</p>`;
    });

    document.getElementById("leaderboard").innerHTML = html;
}

// start pertama
startGame();
</script>

</body>
</html>
